[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "the-butterfly-effect"
version = "0.1.0"
description = "Generative abstract backgrounds rendered from the real internals of GPT-2 (weights, activations, attention, loss surface, embeddings)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gemma Garriga" }]
keywords = [
    "generative-art",
    "gpt2",
    "interpretability",
    "wallpaper",
    "matplotlib",
    "machine-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Artistic Software",
    "Topic :: Multimedia :: Graphics",
]

[project.urls]
Homepage = "https://github.com/gcgarriga/the-butterfly-effect"
Repository = "https://github.com/gcgarriga/the-butterfly-effect"

[tool.setuptools]
packages = ["common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
