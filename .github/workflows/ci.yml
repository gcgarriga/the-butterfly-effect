name: CI

on:
  push:
  pull_request:
  workflow_dispatch:  # allows manually running the model job below

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  smoke:
    # Fast: cache-backed + procedural concepts, no GPT-2 download (no torch needed).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy matplotlib pillow pytest
      - run: pytest -m "not model" -v

  model:
    # Full path incl. the GPT-2-dependent concept; run manually via "Run workflow".
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: pytest -v
        env:
          RUN_MODEL_TESTS: "1"
